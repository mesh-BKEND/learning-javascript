<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basketball scoreboard</title>
    <script src="index.js" defer></script>
    <style>
      body {
        background: black;
        color: white;
        display: flex;
        justify-content: space-around;
      }
      .team {
        padding: 8px 3rem;
        border: 1px solid grey;
      }
      .buttons {
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <div id="home-team" class="team">
      <h1>Home</h1>
      <h2 id="home-counter">0</h2>
      <div class="buttons" id="home">
        <button class="addOne home" onclick="addpoints('home', 1)">+1</button>
        <button class="addTwo home" onclick="addpoints('home', 2)">+2</button>
        <button class="addThree home" onclick="addpoints('home', 3)">+3</button>
      </div>
    </div>
    <div id="guest-team" class="team">
      <h1>Guest</h1>
      <h2 id="guest-counter">0</h2>
      <div class="buttons" id="guest">
        <button class="addOne" onclick="addpoints('guest', 1)">+1</button>
        <button class="addTwo" onclick="addpoints('guest', 2)">+2</button>
        <button class="addThree" onclick="addpoints('guest', 3)">+3</button>
      </div>
    </div>
  </body>
</html>
